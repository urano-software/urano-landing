<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Automatizamos tareas, conectamos sistemas y creamos software a medida para que tu negocio ahorre tiempo, reduzca errores y pueda crecer." />
    <title>Urano Software | Menos tareas manuales. Más crecimiento.</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  </head>
  <body>
    <div id="scroll-bar"></div>

    <header>
      <a class="brand" href="#inicio" aria-label="Urano Software, inicio">
        <img src="logo-urano.jpeg" alt="" />
        <span>URANO SOFTWARE</span>
      </a>
      <nav>
        <a href="#problemas" data-i18n="nav.problems"></a>
        <a href="#soluciones" data-i18n="nav.solutions"></a>
        <a href="#proceso" data-i18n="nav.process"></a>
        <a class="nav-cta" href="#contacto" data-i18n="nav.contact"></a>
        <button id="changeLang" class="lang-btn" type="button" aria-label="Cambiar idioma">EN</button>
      </nav>
    </header>

    <main id="inicio" class="hero">
      <div>
        <div class="hero-badge"><span class="badge-dot"></span><span data-i18n="hero.badge"></span></div>
        <h1 data-i18n-html="hero.title"></h1>
        <p data-i18n="hero.description"></p>
        <div class="actions">
          <a class="btn btn-primary" href="#contacto" data-i18n="hero.contact"></a>
          <a class="btn btn-secondary" href="#problemas" data-i18n="hero.problems"></a>
        </div>
        <div class="microcopy" data-i18n="hero.microcopy"></div>
      </div>

      <div class="visual" aria-label="Resultados que buscamos para tu negocio">
        <div class="result-card featured">
          <span class="result-kicker" data-i18n="hero.before"></span>
          <strong data-i18n="hero.beforeText"></strong>
        </div>
        <div class="flow-line"><span></span></div>
        <div class="result-card">
          <span class="result-kicker cyan" data-i18n="hero.after"></span>
          <strong data-i18n="hero.afterText"></strong>
          <div class="result-tags">
            <span data-i18n="hero.tag1"></span><span data-i18n="hero.tag2"></span><span data-i18n="hero.tag3"></span>
          </div>
        </div>
      </div>
    </main>

    <section id="problemas" class="problems-section">
      <div class="section-label" data-i18n="problems.label"></div>
      <h2 class="section-title" data-i18n="problems.title"></h2>
      <p class="section-intro" data-i18n="problems.intro"></p>
      <div class="pain-grid">
        <article class="pain-card"><span class="pain-number">01</span><h3 data-i18n="problems.manual.title"></h3><p data-i18n="problems.manual.description"></p></article>
        <article class="pain-card"><span class="pain-number">02</span><h3 data-i18n="problems.disconnected.title"></h3><p data-i18n="problems.disconnected.description"></p></article>
        <article class="pain-card"><span class="pain-number">03</span><h3 data-i18n="problems.blind.title"></h3><p data-i18n="problems.blind.description"></p></article>
      </div>
      <div class="pain-cta"><p data-i18n="problems.close"></p><a href="#contacto" data-i18n="problems.cta"></a></div>
    </section>

    <section id="soluciones">
      <div class="section-label" data-i18n="solutions.label"></div>
      <h2 class="section-title" data-i18n="solutions.title"></h2>
      <div class="swiper servicios-swiper">
        <div class="swiper-wrapper">
          <article class="swiper-slide card"><div class="card-icon">↻</div><h3 data-i18n="solutions.automation.title"></h3><p data-i18n="solutions.automation.description"></p><span class="card-result" data-i18n="solutions.automation.result"></span></article>
          <article class="swiper-slide card"><div class="card-icon">⌁</div><h3 data-i18n="solutions.integration.title"></h3><p data-i18n="solutions.integration.description"></p><span class="card-result" data-i18n="solutions.integration.result"></span></article>
          <article class="swiper-slide card"><div class="card-icon">◇</div><h3 data-i18n="solutions.custom.title"></h3><p data-i18n="solutions.custom.description"></p><span class="card-result" data-i18n="solutions.custom.result"></span></article>
          <article class="swiper-slide card"><div class="card-icon">▦</div><h3 data-i18n="solutions.control.title"></h3><p data-i18n="solutions.control.description"></p><span class="card-result" data-i18n="solutions.control.result"></span></article>
        </div>
        <div class="swiper-button-prev"></div><div class="swiper-button-next"></div><div class="swiper-pagination"></div>
      </div>
    </section>

    <section id="proceso" class="process-section">
      <div class="section-label" data-i18n="process.label"></div>
      <h2 class="section-title" data-i18n="process.title"></h2>
      <div class="process-grid">
        <article><span>1</span><h3 data-i18n="process.step1.title"></h3><p data-i18n="process.step1.description"></p></article>
        <article><span>2</span><h3 data-i18n="process.step2.title"></h3><p data-i18n="process.step2.description"></p></article>
        <article><span>3</span><h3 data-i18n="process.step3.title"></h3><p data-i18n="process.step3.description"></p></article>
      </div>
    </section>

    <section id="contacto">
      <div class="contact">
        <div class="section-label" data-i18n="contact.label"></div>
        <h2 class="section-title" data-i18n="contact.title"></h2>
        <p data-i18n="contact.description"></p>
        <form class="contact-form" action="https://formsubmit.co/softwareurano@gmail.com" method="POST">
          <input type="hidden" name="_subject" value="Nueva consulta desde la web de Urano Software" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_captcha" value="false" />
          <input class="form-trap" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <div class="form-row">
            <label><span data-i18n="contact.name"></span><input type="text" name="Nombre" required autocomplete="name" data-i18n-placeholder="contact.namePlaceholder" /></label>
            <label><span data-i18n="contact.email"></span><input type="email" name="Email" required autocomplete="email" data-i18n-placeholder="contact.emailPlaceholder" /></label>
          </div>
          <label><span data-i18n="contact.business"></span><input type="text" name="Empresa" autocomplete="organization" data-i18n-placeholder="contact.businessPlaceholder" /></label>
          <label><span data-i18n="contact.problem"></span><textarea name="Problema o proceso a mejorar" rows="5" required minlength="15" data-i18n-placeholder="contact.problemPlaceholder"></textarea></label>
          <button class="submit-btn" type="submit"><span data-i18n="contact.cta"></span><span aria-hidden="true">→</span></button>
          <small data-i18n="contact.note"></small>
        </form>
      </div>
    </section>

    <footer data-i18n="footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.11.5/i18next.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
