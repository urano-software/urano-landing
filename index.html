<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urano Software</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>

  <body>
    <div id="scroll-bar"></div>
    <header>
      <div class="brand">
        <img src="logo-urano.jpeg" alt="Urano Software" />
        <span>URANO SOFTWARE</span>
      </div>

      <nav>
        <a href="#servicios" data-i18n="nav.services"></a>
        <a href="#tecnologias" data-i18n="nav.tech"></a>
        <a href="#contacto" data-i18n="nav.contact"></a>
        <button id="changeLang" class="lang-btn" type="button">EN</button>
      </nav>
    </header>

    <main class="hero">
      <div>
        <h1 data-i18n="hero.title"></h1>

        <p data-i18n="hero.description"></p>

        <div class="actions">
          <a
            class="btn btn-primary"
            href="#contacto"
            data-i18n="hero.contact"
          ></a>

          <a
            class="btn btn-secondary"
            href="#servicios"
            data-i18n="hero.services"
          ></a>
        </div>
      </div>

      <div class="visual">
        <img src="logo-urano.jpeg" alt="Logo Urano Software" />
      </div>
    </main>

    <section id="servicios">
      <h2 class="section-title" data-i18n="services.title"></h2>

      <div class="swiper servicios-swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide card">
            <div class="card-icon">⚙️</div>
            <h3 data-i18n="services.custom.title"></h3>
            <p data-i18n="services.custom.description"></p>
          </div>

          <div class="swiper-slide card">
            <div class="card-icon">⚡</div>
            <h3 data-i18n="services.automation.title"></h3>
            <p data-i18n="services.automation.description"></p>
          </div>

          <div class="swiper-slide card">
            <div class="card-icon">🔗</div>
            <h3 data-i18n="services.api.title"></h3>
            <p data-i18n="services.api.description"></p>
          </div>

          <div class="swiper-slide card">
            <div class="card-icon">📐</div>
            <h3 data-i18n="services.scalable.title"></h3>
            <p data-i18n="services.scalable.description"></p>
          </div>

          <div class="swiper-slide card">
            <div class="card-icon">🖥️</div>
            <h3 data-i18n="services.scada.title"></h3>
            <p data-i18n="services.scada.description"></p>
          </div>
        </div>

        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-pagination"></div>
      </div>
    </section>
    <section id="tecnologias" class="techs">
      <h2 class="section-title" data-i18n="nav.tech"></h2>

      <span class="tech">.NET</span>
      <span class="tech">SQL Server</span>
      <span class="tech">APIs REST</span>
      <span class="tech">RabbitMQ</span>
      <span class="tech">SignalR</span>
      <span class="tech">Docker</span>
      <span class="tech">JavaScript</span>
      <span class="tech">AWS</span>
      <span class="tech">SCADA</span>
    </section>
    <section id="contacto">
      <div class="contact">
        <h2 class="section-title" data-i18n="contact.title"></h2>

        <p data-i18n="contact.description"></p>

        <a
          class="instagram-btn"
          href="https://instagram.com/urano_software"
          target="_blank"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path
              d="M7.75 2C4.574 2 2 4.574 2 7.75v8.5C2 19.426 4.574 22 7.75 22h8.5C19.426 22 22 19.426 22 16.25v-8.5C22 4.574 19.426 2 16.25 2h-8.5zm0 2h8.5A3.75 3.75 0 0 1 20 7.75v8.5A3.75 3.75 0 0 1 16.25 20h-8.5A3.75 3.75 0 0 1 4 16.25v-8.5A3.75 3.75 0 0 1 7.75 4zm8.75 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"
            />
          </svg>

          <span>Instagram</span>
        </a>
      </div>
    </section>

    <footer data-i18n="footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/i18next@23.11.5/i18next.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
